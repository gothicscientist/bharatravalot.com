<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bharat Ravalot</title>
    <meta name="description" content="Bharat Ravalot: Economics and Data Science at UC Berkeley, founder of Radiant Tech, builder of Thock, pileGo and Strata. Walk west across the Thar, from dawn to the last fire." />
    <meta name="theme-color" content="#0b1026" />
    <meta property="og:title" content="Bharat Ravalot" />
    <meta property="og:description" content="A day in the Thar: walk west from dawn to night through the work of Bharat Ravalot." />
    <meta property="og:image" content="https://bharatravalot.com/og.jpg" />
    <meta property="og:url" content="https://bharatravalot.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://bharatravalot.com/" />
    <script>
      // Reduced motion, or no WebGL 2: go straight to the quick view.
      (function () {
        var c = document.createElement('canvas');
        var ok = !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
        if (!ok) location.replace('/work/?from=world');
      })();
    </script>
  </head>
  <body>
    <canvas id="world" aria-label="An illustrated desert in Rajasthan that you can walk through. Use the quick view link for a text version." role="img"></canvas>

    <header id="hud">
      <a class="mark" href="/" aria-label="Bharat Ravalot, home"><span lang="hi">भरत</span><em>Bharat Ravalot</em></a>
      <nav>
        <a class="quick" href="/work/">Quick view</a>
        <button id="sound" type="button" aria-pressed="false"><i aria-hidden="true"></i><span>Sound off</span></button>
      </nav>
    </header>

    <section id="card" aria-live="polite"></section>
    <div id="place" aria-hidden="true"></div>

    <nav id="sunpath" aria-label="Journey: jump to any place">
      <svg role="group"></svg>
    </nav>

    <div id="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title">
      <div class="intro-inner">
        <p class="intro-local" lang="hi">पधारो म्हारे देस</p>
        <p class="intro-trans"><em>Padharo mhare des.</em> Welcome to my land.</p>
        <h1 id="intro-title" class="intro-name">Bharat Ravalot</h1>
        <p class="intro-sub">A day in the Thar, from before dawn to the last fire. Each place along the way holds a piece of my work.</p>
        <div class="intro-actions">
          <button data-enter type="button">Enter with sound</button>
          <button data-quiet type="button" class="ghost">Enter quietly</button>
        </div>
        <p class="intro-skip">In a hurry? <a href="/work/">Read the quick view</a></p>
      </div>
    </div>

    <div id="chapter" hidden role="dialog" aria-modal="true" aria-label="Details">
      <article class="chapter-page">
        <button data-close type="button" aria-label="Close and keep walking">Keep walking</button>
        <div class="chapter-body"></div>
      </article>
    </div>

    <noscript><p class="noscript">This journey needs JavaScript. <a href="/work/">Read the quick view</a>.</p></noscript>
    <script type="module" src="/src/world/entry.ts"></script>
  </body>
</html>
